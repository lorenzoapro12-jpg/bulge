<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0716">
<title>BULGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0716;--ink:#efeaff;--dim:#8f89b3;--cy:#2de2ff;--mg:#ff2d95;--gd:#ffc93c;--vi:#a45cff;--rd:#ff3355;--lm:#7dff4a;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{height:100%;background:var(--bg);color:var(--ink);font-family:"Chakra Petch","Segoe UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
button{font-family:inherit;color:inherit}
.fxo{position:absolute;inset:0;pointer-events:none;will-change:opacity}
#vig{background-image:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(2,0,8,.5) 100%)}
#hurt{opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,70,0) 42%,rgba(255,40,70,.62) 100%)}
#flash{opacity:0;background:#fff}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px}

#safeprobe{position:absolute;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#topbtns{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;gap:8px;z-index:20}
.ico{width:42px;height:42px;background:rgba(16,10,30,.7);border:1px solid rgba(255,255,255,.16);font-size:16px;cursor:pointer;border-radius:50%}
.ico:hover{border-color:var(--cy)}
#bPause{display:none}
body.ingame #bPause{display:block}

.ov{position:absolute;inset:0;z-index:10;display:none;overflow-y:auto;padding:28px 18px;background:radial-gradient(ellipse at 50% 40%,rgba(30,14,58,.8),rgba(8,4,16,.94))}
.ov.clear{background:radial-gradient(ellipse at 50% 50%,rgba(20,10,40,.66),rgba(8,4,16,.88))}
.ov.on{display:flex;animation:ovin .2s ease-out}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.in{margin:auto;width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
h2{font-weight:700;font-size:clamp(28px,6vw,40px);letter-spacing:.02em;line-height:1.1}
h3{font-weight:700;font-size:18px;color:var(--dim);margin-top:6px}
.muted{color:var(--dim);font-weight:500}
p.sub{color:#c9c3ea;font-size:16px;max-width:52ch;line-height:1.4}

.logo{position:relative;isolation:isolate;font-weight:700;font-size:clamp(64px,19vw,132px);letter-spacing:.04em;line-height:.9;color:#fff;
  text-shadow:0 0 16px rgba(45,226,255,.85),0 0 60px rgba(164,92,255,.6)}
.logo::before,.logo::after{content:attr(data-t);position:absolute;inset:0;mix-blend-mode:screen;text-shadow:none}
.logo::before{color:var(--mg);clip-path:inset(0 0 58% 0);animation:gl1 3.2s infinite steps(1)}
.logo::after{color:var(--cy);clip-path:inset(58% 0 0 0);animation:gl2 2.6s infinite steps(1)}
@keyframes gl1{0%,90%{transform:none}91%{transform:translate(-7px,1px)}94%{transform:translate(5px,-2px)}97%{transform:translate(-2px,0)}}
@keyframes gl2{0%,86%{transform:none}87%{transform:translate(6px,0)}91%{transform:translate(-5px,2px)}95%{transform:none}}
.tag{font-size:clamp(17px,4vw,21px);color:#d7d0ff;letter-spacing:.06em}
.mstats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.pill{display:flex;flex-direction:column;align-items:center;min-width:88px;padding:8px 12px;border:1px solid rgba(164,92,255,.35);background:rgba(164,92,255,.08);border-radius:22px}
.pill b{font-size:18px}.pill span{font-size:12px;color:var(--dim)}
.btns{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.btns.row{flex-direction:row;justify-content:center;width:auto;flex-wrap:wrap}
.btn{font-weight:700;font-size:17px;letter-spacing:.06em;padding:13px 24px;min-height:50px;background:rgba(18,10,34,.85);border:1px solid rgba(45,226,255,.45);cursor:pointer;border-radius:26px;transition:background .12s,border-color .12s,transform .08s}
.btn:hover{background:rgba(45,226,255,.14);border-color:var(--cy)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--cy);color:#07030f;border-color:var(--cy);box-shadow:0 0 28px rgba(45,226,255,.45)}
.btn.pri:hover{background:#86f0ff}
.btn.ghost{border-color:rgba(255,255,255,.18)}
.btn.warn{border-color:rgba(255,51,85,.5);color:#ff8ea2}
.btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.hint{font-size:14px;color:var(--dim);max-width:44ch;line-height:1.45}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;width:100%}
.card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px 16px 16px;cursor:pointer;
  background:linear-gradient(165deg,rgba(45,226,255,.1),rgba(18,10,34,.92) 55%);border:1px solid rgba(45,226,255,.4);border-radius:20px 20px 20px 4px;transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--cy)}
.card .ic{font-size:30px;line-height:1;color:var(--cy)}
.card .cat{font-size:12px;color:var(--dim);letter-spacing:.08em}
.card .nm{font-weight:700;font-size:20px;line-height:1.15}
.card .ds{font-size:14px;line-height:1.4;color:#c7c1e6}
.card .key{position:absolute;top:10px;right:14px;font-size:12px;color:var(--dim)}
.card.mut{background:linear-gradient(165deg,rgba(255,201,60,.16),rgba(18,10,34,.92) 55%);border-color:rgba(255,201,60,.55)}
.card.mut .ic{color:var(--gd)}.card.mut:hover{border-color:var(--gd)}
/* pacte : un pouvoir fort contre un prix (gp.js PAC) */
.card.pact{background:linear-gradient(165deg,rgba(255,51,85,.16),rgba(18,10,34,.92) 55%);border-color:rgba(255,51,85,.55)}
.card.pact .ic{color:var(--rd)}.card.pact:hover{border-color:var(--rd)}
.card .cost{font-size:13px;line-height:1.35;color:#ff8ea2}

.endt{font-size:clamp(40px,11vw,76px);font-weight:700;line-height:1}
.endt.win{color:var(--gd);text-shadow:0 0 30px rgba(255,201,60,.6)}
.endt.lose{color:var(--rd);text-shadow:0 0 30px rgba(255,51,85,.6)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.st{display:flex;flex-direction:column;gap:2px;padding:10px 6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px}
.st .l{font-size:12px;color:var(--dim)}.st .v{font-size:24px;font-weight:700}
.st.big{grid-column:1/-1}.st.big .v{font-size:42px;color:var(--gd)}
.rec{font-size:13px;color:#07030f;background:var(--gd);align-self:center;padding:2px 10px;border-radius:10px}
.build{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:12px;background:rgba(45,226,255,.1);border:1px solid rgba(45,226,255,.3)}
.chip.mut{background:rgba(255,201,60,.12);border-color:rgba(255,201,60,.45);color:var(--gd)}.chip.pact{background:rgba(255,51,85,.1);border-color:rgba(255,51,85,.45);color:#ff8ea2}
#fade{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0}#fade.go{animation:fadeout var(--d,.8s) ease-out}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.ov.on>.in{animation:inrise .38s cubic-bezier(.2,.8,.2,1)}@keyframes inrise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
#cv{transition:opacity 1.2s ease}#cv.dying{opacity:.62}
@media (prefers-reduced-motion:reduce){.ov.on>.in{animation:none}#cv{transition:none}}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
td.num{font-weight:700;color:var(--gd)}
@media (max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}.st .v{font-size:20px}.cards{grid-template-columns:1fr}.card{padding:14px}}
@media (prefers-reduced-motion:reduce){.logo::before,.logo::after{animation:none}.ov.on{animation:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas><div class="fxo" id="vig"></div><div class="fxo" id="hurt"></div><div class="fxo" id="flash"></div>
<div id="safeprobe"></div><div id="fade"></div><div id="topbtns"><button class="ico" id="bPause" aria-label="Pause">❚❚</button><button class="ico" id="bMute" aria-label="Couper le son">🔊</button></div>

<div class="ov on" id="ov-menu"><div class="in">
  <div class="logo" data-t="BULGE">BULGE</div>
  <p class="tag">Huit îlots. Une bulle qui grandit.</p>
  <div class="mstats" id="mStats"></div>
  <div class="btns">
    <button class="btn pri" id="bPlay">Jouer</button>
    <button class="btn" id="bLb">Records</button>
  </div>
  <p class="hint" id="mHint"></p>
</div></div>

<div class="ov clear" id="ov-evo"><div class="in">
  <h2 id="evoT">Mutation</h2>
  <p class="sub" id="evoS"></p>
  <div class="cards" id="evoCards"></div>
  <button class="btn ghost" id="bReroll" hidden>Relancer</button>
</div></div>

<div class="ov clear" id="ov-pause"><div class="in">
  <h2>Pause</h2>
  <p class="sub" id="pauseInfo"></p>
  <div class="build" id="pauseBuild"></div>
  <div class="btns">
    <button class="btn pri" id="bResume">Reprendre</button>
    <button class="btn warn" id="bQuit">Abandonner la partie</button>
  </div>
</div></div>

<div class="ov" id="ov-end"><div class="in">
  <div class="endt" id="endT"></div>
  <p class="sub" id="endS"></p>
  <div class="stats" id="endStats"></div>
  <div class="build" id="endBuild"></div>
  <div class="btns row">
    <button class="btn pri" id="bAgain">Rejouer</button>
    <button class="btn ghost" id="bMenu">Menu</button>
  </div>
</div></div>

<div class="ov" id="ov-lb"><div class="in">
  <h2>Records</h2>
  <table><tbody id="lbBody"></tbody></table>
  <div class="btns row"><button class="btn ghost back">Retour</button><button class="btn warn" id="bReset">Effacer les records</button></div>
</div></div>
</div>
<script>
